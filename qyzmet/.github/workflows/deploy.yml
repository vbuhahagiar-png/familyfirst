name: Qyzmet CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Flutter Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
        working-directory: qyzmet
      - name: Analyze
        run: flutter analyze
        working-directory: qyzmet
      - name: Test
        run: flutter test
        working-directory: qyzmet

  deploy-functions:
    name: Deploy Cloud Functions
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Install dependencies
        run: npm ci
        working-directory: qyzmet/functions
      - name: Build
        run: npm run build
        working-directory: qyzmet/functions
      - name: Deploy to Firebase
        run: firebase deploy --only functions,firestore,storage --token ${{ secrets.FIREBASE_TOKEN }}
        working-directory: qyzmet

  build-android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
      - run: flutter pub get
        working-directory: qyzmet
      - run: flutter build apk --release
        working-directory: qyzmet
      - uses: actions/upload-artifact@v4
        with:
          name: qyzmet-release.apk
          path: qyzmet/build/app/outputs/flutter-apk/app-release.apk
