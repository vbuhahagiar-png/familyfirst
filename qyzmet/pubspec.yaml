name: qyzmet
description: Book. Pay. Relax. - Home services platform in Kazakhstan
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0
  cloud_functions: ^5.0.0

  # State Management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Navigation
  go_router: ^13.0.0

  # UI
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.0
  lottie: ^3.0.0
  shimmer: ^3.0.0

  # Payments
  flutter_stripe: ^10.0.0

  # Utils
  intl: ^0.20.2
  shared_preferences: ^2.2.0
  url_launcher: ^6.2.0
  image_picker: ^1.0.0
  permission_handler: ^11.0.0

  # Auth
  google_sign_in: ^6.2.0
  sign_in_with_apple: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.3.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
