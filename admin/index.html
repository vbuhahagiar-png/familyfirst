<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Qyzmet Admin — Вход</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .login-hint { font-size: 12px; color: var(--text-muted); text-align: center; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-big">QYZMET</div>
        <div class="logo-label">Admin Panel</div>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-input" placeholder="admin@qyzmet.kz" required/>
        </div>
        <div class="form-group">
          <label class="form-label">Пароль</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required/>
        </div>
        <div id="error-msg" class="error-msg"></div>
        <button type="submit" class="login-btn" id="submit-btn">Войти</button>
      </form>

      <p class="login-hint">Доступ только для администраторов Qyzmet</p>
    </div>
  </div>

  <script type="module">
    import { login } from './js/auth.js';

    const params = new URLSearchParams(window.location.search);
    if (params.get('error') === 'unauthorized') {
      const errEl = document.getElementById('error-msg');
      errEl.textContent = 'Доступ запрещен. Нет прав администратора.';
      errEl.style.display = 'block';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const errEl = document.getElementById('error-msg');
      btn.textContent = 'Вход...';
      btn.disabled = true;
      errEl.style.display = 'none';

      try {
        await login(
          document.getElementById('email').value,
          document.getElementById('password').value
        );
        window.location.href = 'dashboard.html';
      } catch (err) {
        errEl.textContent = err.message || 'Неверный email или пароль';
        errEl.style.display = 'block';
        btn.textContent = 'Войти';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
